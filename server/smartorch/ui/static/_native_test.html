<!doctype html>
<html lang="es">
<head>
<base href="/">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SmartOrch</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ctext y='13' font-size='14'%3E%E2%9A%A1%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/app.css">
<link rel="stylesheet" href="/static/_vscode-theme.css">
</head>
<body>
<div class="app" id="app">
  <aside class="sidebar" id="sidebar" aria-label="Conversaciones">
    <div class="side-head">
      <div class="brand"><span class="bolt">⚡</span> SmartOrch</div>
      <button class="btn primary" id="newChat" title="Nueva conversación (Ctrl+K)">+ Nueva</button>
    </div>
    <input class="search" id="search" type="search" placeholder="Buscar en el historial…" aria-label="Buscar conversaciones">
    <div class="conv-list" id="convList" role="list"></div>
    <div class="side-foot">
      <span class="status" id="status"><i class="dot"></i><span id="statusText">Conectando…</span></span>
      <button class="icon-btn" id="themeBtn" title="Cambiar tema" aria-label="Cambiar tema">◐</button>
    </div>
  </aside>

  <main class="main">
    <header class="top">
      <button class="icon-btn only-mobile" id="menuBtn" aria-label="Menú">☰</button>
      <div class="top-title" id="topTitle">Nueva conversación</div>
      <div class="top-actions">
        <span class="chip" id="sourceChip" hidden></span>
        <button class="btn" id="vscodeBtn" title="Abrir esta conversación en VS Code" hidden>Abrir en VS Code</button>
        <button class="btn" id="copyMdBtn" title="Copiar la conversación como Markdown" hidden>Copiar MD</button>
      </div>
    </header>

    <div class="offline" id="offlineBanner" role="alert" hidden>
      <span id="offlineText">Ollama no está corriendo.</span>
      <button class="btn" id="offlineStart" type="button" hidden>Iniciar Ollama</button>
      <button class="btn" id="offlineRetry" type="button">Reintentar</button>
    </div>

    <div class="pipeline" id="pipeline" hidden>
      <span data-step="router">Router</span><span data-step="rag">RAG</span><span data-step="cot">CoT</span>
      <span data-step="thinking">Pensando</span><span data-step="llm">LLM</span>
    </div>

    <section class="messages" id="messages" aria-live="polite">
      <div class="empty" id="empty">
        <div class="empty-bolt">⚡</div>
        <h1>¿En qué trabajamos hoy?</h1>
        <p>IA local con RAG sobre tu proyecto. Tus conversaciones se comparten con la terminal y VS Code.</p>
        <div class="starters" id="starters"></div>
      </div>
    </section>

    <footer class="composer">
      <div class="slash-menu" id="slashMenu" hidden></div>
      <div class="toolbar" id="agentBar">
        <div class="seg" id="modeSeg" role="group" aria-label="Modo">
          <button type="button" data-mode="ask" title="Chat con el contexto de tu proyecto. No usa herramientas.">💬 Preguntar</button>
          <button type="button" data-mode="plan" title="Investiga tu proyecto y propone un plan. No modifica nada.">🧭 Plan</button>
          <button type="button" data-mode="agent" title="Lee, edita y ejecuta, siempre con tu aprobación.">🛠 Agente</button>
        </div>
        <div class="seg" id="effortSeg" role="group" aria-label="Esfuerzo">
          <button type="button" data-effort="rapido" title="Un paso, sin verificación extra. Respuestas en segundos.">⚡ Rápido</button>
          <button type="button" data-effort="normal" title="Equilibrio entre velocidad y calidad.">Normal</button>
          <button type="button" data-effort="maximo" title="Planifica, investiga, verifica con tests y reintenta. Más lento, más fiable.">🔥 Máximo</button>
        </div>
        <select id="approvalMode" title="Qué puede hacer sin preguntarte" hidden>
          <option value="ask">Preguntar siempre</option>
          <option value="auto_edits">Editar archivos solo</option>
          <option value="readonly">Solo lectura</option>
        </select>
        <label class="webtoggle" id="webLabel" title="Permite buscar en internet. Cada consulta te la muestra y la apruebas tú." hidden><input type="checkbox" id="webToggle"> 🌐 Web</label>
        <span class="ws" id="wsChip" hidden></span>
      </div>
      <div class="box">
        <textarea id="input" rows="1" placeholder="Escribe un mensaje o / para comandos…  (Enter envía · Shift+Enter nueva línea)" aria-label="Mensaje"></textarea>
        <button class="btn primary send" id="sendBtn">Enviar</button>
        <button class="btn danger send" id="stopBtn" hidden>Detener</button>
      </div>
      <div class="foot-note">
        <label class="ctx" id="ctxLabel" hidden><input type="checkbox" id="ctxToggle" checked> Incluir archivo activo</label>
        <span>Modelos locales · Privado · Sin límites</span>
        <a id="donate" href="#" target="_blank" rel="noopener" hidden>♥ Apoyar el proyecto</a>
      </div>
    </footer>
  </main>
</div>
<div class="toast" id="toast" role="status" hidden></div>
<script>
window.__host = { msgs: [], dialogAnswer: { prompt: "Titulo renombrado", confirm: true } };
function toWebview(m) { window.postMessage(m, "*"); }
window.acquireVsCodeApi = () => ({ postMessage: async (m) => {
  if (!m || !m.smartorch) return;
  window.__host.msgs.push(m.type);
  if (m.type === "ready") { window.__host.ready = true; return; }
  if (m.type === "http") {
    try {
      const r = await fetch(m.path, { method: m.method || "GET", headers: { Authorization: "Bearer smartorch-local-key", "Content-Type": "application/json" }, body: typeof m.body === "string" ? m.body : undefined });
      const ct = r.headers.get("content-type") || "";
      let data = ct.includes("json") ? await r.json() : await r.text();
      if (m.path === "/smartorch/ui-config") data = { ...data, api_key: "", auth: false };
      toWebview(r.ok ? { type: "http-result", id: m.id, ok: true, status: r.status, data } : { type: "http-result", id: m.id, ok: false, status: r.status, error: r.status + " " + r.statusText });
    } catch (e) { toWebview({ type: "http-result", id: m.id, ok: false, status: 0, error: String(e) }); }
  } else if (m.type === "stream") {
    const ctrl = new AbortController(); (window.__host.ctrls = window.__host.ctrls || {})[m.id] = ctrl;
    try {
      const r = await fetch(m.path, { method: "POST", headers: { Authorization: "Bearer smartorch-local-key", "Content-Type": "application/json" }, body: JSON.stringify(m.body), signal: ctrl.signal });
      const reader = r.body.getReader(); const dec = new TextDecoder(); let buf = "";
      for (;;) {
        const { value, done } = await reader.read(); if (done) break;
        buf += dec.decode(value, { stream: true }); let i;
        while ((i = buf.indexOf("\n\n")) >= 0) {
          const line = buf.slice(0, i).trim(); buf = buf.slice(i + 2);
          if (!line.startsWith("data:")) continue; const p = line.slice(5).trim(); if (p === "[DONE]") continue;
          try { toWebview({ type: "stream-event", id: m.id, event: JSON.parse(p) }); } catch {}
        }
      }
      toWebview({ type: "stream-end", id: m.id });
    } catch (e) { toWebview(ctrl.signal.aborted ? { type: "stream-end", id: m.id } : { type: "stream-error", id: m.id, message: String(e) }); }
  } else if (m.type === "abort") { const c = (window.__host.ctrls || {})[m.id]; if (c) c.abort(); }
  else if (m.type === "dialog") { toWebview({ type: "dialogResult", id: m.id, value: m.kind === "prompt" ? window.__host.dialogAnswer.prompt : window.__host.dialogAnswer.confirm }); }
  else if (m.type === "getContext") { toWebview({ type: "context", file: "demo.py", language: "python", selection: "", text: "def demo():\n    return 42\n" }); }
} });
</script>
<script>
(() => {
  const vscode = acquireVsCodeApi();
  let seq = 0;
  const calls = new Map();
  const streams = new Map();
  window.addEventListener('message', (e) => {
    const m = e.data;
    if (!m) return;
    if (m.type === 'http-result') {
      const c = calls.get(m.id); calls.delete(m.id);
      if (c) m.ok ? c.resolve(m.data) : c.reject(new Error(m.error || ('HTTP ' + m.status)));
    } else if (m.type === 'stream-event') {
      const s = streams.get(m.id); if (s) s.onEvent(m.event);
    } else if (m.type === 'stream-end' || m.type === 'stream-error') {
      const s = streams.get(m.id); streams.delete(m.id);
      if (s) m.type === 'stream-end' ? s.resolve() : s.reject(new Error(m.message || 'error de streaming'));
    }
  });
  const request = (path, opts) => new Promise((resolve, reject) => {
    const id = ++seq; calls.set(id, { resolve, reject });
    vscode.postMessage({ smartorch: true, type: 'http', id, path, method: opts && opts.method, body: opts && opts.body });
  });
  window.SmartOrchNative = {
    workspace: "E:\\smartorch-project",
    post: (msg) => vscode.postMessage(msg),
    transport: {
      request,
      stream: (path, body, onEvent, signal) => new Promise((resolve, reject) => {
        const id = ++seq; streams.set(id, { onEvent, resolve, reject });
        if (signal) signal.addEventListener('abort', () => {
          vscode.postMessage({ smartorch: true, type: 'abort', id });
          const e = new Error('abortado'); e.name = 'AbortError'; reject(e);
        });
        vscode.postMessage({ smartorch: true, type: 'stream', id, path, body });
      }),
      config: () => request('/smartorch/ui-config'),
      health: () => request('/health'),
    },
  };
})();</script>
<script src="/static/app.js"></script>
</body>
</html>
